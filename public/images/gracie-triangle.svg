  <polygon points="50,44 32,73 45,73" fill="#FFFFFF"/>
  <circle cx="50" cy="58" r="4.5" fill="#0A0C13"/>
  
  <!-- Bottom Baseline accent -->
  <rect x="22" y="87" width="56" height="3" rx="1.5" fill="url(#gracieGoldGrad)"/>
